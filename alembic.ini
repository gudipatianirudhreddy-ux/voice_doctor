# A generic, single database configuration.

[alembic]
# Migrations were moved into backend/app with the backend folder.
script_location = %(here)s/backend/app/migrations

# Add the backend folder so migration env.py can import the app package.
prepend_sys_path = %(here)s/backend

# timezone to use when rendering migration dates; leave blank for local time.
# timezone =

# path separator for lists of paths.
path_separator = os

# Output encoding for migration scripts.
output_encoding = utf-8

# Database URL is loaded from DATABASE_URL by backend/app/migrations/env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
